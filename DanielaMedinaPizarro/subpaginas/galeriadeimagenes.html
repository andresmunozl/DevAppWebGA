<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería de Imágenes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        nav {
            text-align: center;
            padding: 20px;
        }

        .volver {
            display: inline-block;
            padding: 10px 20px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .volver:hover {
            background: #3730a3;
            transform: translateY(-2px);
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .imagen {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: 0.3s;
        }

        .imagen:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .imagen img {
            display: block;
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
            color: #666;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }

            .imagen img {
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📸 Galería de Imágenes</h1>
        <p>Explora nuestra colección de imágenes</p>
    </header>

    <nav>
        <a class="volver" href="../index.html">← Volver al inicio</a>
    </nav>

    <main>
        <section class="galeria">
            <div class="imagen">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3FqmDfBvCAhqTqPJj5aVkuDzoVRotNf8ZdXLdNLVlkf3nwm3G-7JrDXTb&s=10"
                    alt="Imagen de la galería"
                >
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Mi Galería de Imágenes</p>
    </footer>

</body>
</html>
