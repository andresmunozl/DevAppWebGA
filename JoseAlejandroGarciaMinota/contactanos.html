<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contáctanos</title>
</head>
<body>
	<header>
		<h1>Contáctanos</h1>
		<p>Estamos disponibles para atender tus preguntas.</p>
	</header>

	<nav>
		<a href="index.html">Volver al inicio</a>
	</nav>

	<main>
		<h2>Escríbenos</h2>
		<p>También puedes contactarnos en <a href="mailto:contacto@ejemplo.com">contacto@ejemplo.com</a>.</p>

		<form action="mailto:contacto@ejemplo.com" method="post" enctype="text/plain">
			<label for="nombre">Nombre</label>
			<input type="text" id="nombre" name="nombre" required>

			<label for="correo">Correo electrónico</label>
			<input type="email" id="correo" name="correo" required>

			<label for="mensaje">Mensaje</label>
			<textarea id="mensaje" name="mensaje" required></textarea>

			<button type="submit">Enviar mensaje</button>
		</form>
	</main>
</body>
</html>
